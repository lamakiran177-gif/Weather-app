<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weaether App</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="Enter your location" class="input-box">
                
                <button class="fa-solid fa-magnifying-glass" id="search-Btn"></button>
            </div>
              
        </div> 

        <div class="location-not-found">
            <h1>Sorry, Location not found!!!</h1>
            <img src="image/p6.png" alt="404 Error">
        </div>

        <div class="weather-body">
            <img src="image/p1.png" alt="Weather image" class="weather-img">
             
            <div class="weather-box">
                <p class="temperature">0<sup>°C</sup></p>
                <p class="description">light cloudy</p>
            </div>

            <div class="weather-details">
                <div class="humidity">
                    <i class="fa-solid fa-droplet"></i>
                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="wind">
                   <i class="fa-solid fa-wind"></i>
                    <div class="text">
                        <span id="wind_speed">12km/H</span>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="javascript.js"></script>
      <script src="https://kit.fontawesome.com/7ba59b1d95.js" crossorigin="anonymous"></script>
</body>
</html>
